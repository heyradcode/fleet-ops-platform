# =============================================================================
# NetPulse GraphQL API (AWS AppSync)
# =============================================================================
# AppSync-specific things to notice, because they are what separates "I have
# used GraphQL" from "I have built on AppSync":
#
#   @aws_cognito_user_pools / @aws_iam / @aws_api_key
#       Authorisation is declared IN THE SCHEMA, per type and per field. You can
#       run several auth modes at once - Cognito for operators, IAM for the
#       ingest Lambda - and AppSync enforces it before a resolver runs.
#
#   @aws_auth(cognito_groups: [...])
#       Field-level RBAC with no resolver code at all.
#
#   @aws_subscription(mutations: [...])
#       Subscriptions are DERIVED from mutations. You do not publish manually:
#       when the named mutation succeeds, AppSync pushes the result over
#       WebSocket to every client whose filter matches. This is the single
#       biggest reason to choose AppSync over a hand-rolled GraphQL server.
#
# THE SUBSCRIPTION FILTER IS A COST DECISION, NOT A FEATURE. An operator
# watching Dallas must not be woken by - or billed for - every site's traffic.
# See `onDeviceAlarm` at the bottom.
#
# WHAT IS DELIBERATELY ABSENT: observations are not subscribable. Only alarms
# and incidents are. Tens of thousands of records a second through a WebSocket
# fan-out would make the bill scale with estate size rather than with incidents,
# and no human could read the result. Current state is polled; decisions are
# pushed.
# =============================================================================

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# -----------------------------------------------------------------------------
# Enums - mirror src/platform/types.ts exactly.
# -----------------------------------------------------------------------------

enum Severity { ok info warning critical }
enum IncidentStatus { open acknowledged resolved }
enum DeviceStatus { healthy degraded down unknown }
enum DeviceRole { core distribution access wan_edge wireless_ap firewall }
enum Vendor { cisco juniper aruba }

# How an observation reached us. Every path is HTTP - a polled cloud API, that
# same cloud calling us back, or our own probe. NEVER used to infer the plane.
enum Encoding { rest_json webhook probe }

# WHO OBSERVED IT. The most load-bearing enum in this schema - corroboration is
# defined over these, not over feeds. See ObservationPlane in types.ts.
enum ObservationPlane { device controller external }

enum AlarmKind {
  link_down
  device_unreachable
  adjacency_lost
  interface_errors
  capacity_saturation
  optical_degradation
  power_fault
}

# -----------------------------------------------------------------------------
# The estate
# -----------------------------------------------------------------------------

type Site @aws_cognito_user_pools {
  siteId: ID!
  name: String!
  region: String!
  lon: Float!
  lat: Float!
  headcount: Int!
}

"""
A device's current condition. THE HOT STATE - one item per device, overwritten
on every observation, never appended to.
"""
type Device @aws_cognito_user_pools {
  deviceId: ID!
  name: String!
  siteId: ID!
  role: DeviceRole!
  vendor: Vendor!
  status: DeviceStatus!
  lon: Float!
  lat: Float!
  cpuUtilisation: Float!
  interfacesDown: Int!

  """
  Denormalised onto the hot item so the board can draw the uplink chain from
  the same read that fetched the device. Resolving it separately would be one
  round trip per row.
  """
  uplinkDeviceId: ID

  updatedAt: AWSDateTime!

  """
  Everything seen about this device, across every feed AND every plane.

  N+1 LIVES HERE: `devices { observations { .. } }` calls this once per device.
  Fixes, in order of preference: a BatchInvoke resolver (AppSync hands the
  Lambda an array of up to 2000 events), per-resolver caching keyed on
  $context.source, or denormalising the top few onto the Device item at write
  time.
  """
  observations(limit: Int = 20, severity: Severity): [Observation!]!
    @aws_cognito_user_pools
}

# -----------------------------------------------------------------------------
# Observations - the three-way fork, as a GraphQL interface
# -----------------------------------------------------------------------------

"""
The canonical shape. Cisco, Juniper and Aruba all describe the same network in
different words; every mapper translates into this.

An INTERFACE rather than one fat type, because network data is genuinely three
things - a sampled number, a discrete state change, and a traffic aggregate -
and flattening them means writing `value: 1` for a link going down and then
inventing a threshold for it.
"""
interface Observation @aws_cognito_user_pools {
  observationId: ID!
  deviceId: ID!
  interfaceId: ID
  siteId: ID
  vendor: Vendor!
  encoding: Encoding!
  plane: ObservationPlane!
  severity: Severity!
  observedAt: AWSDateTime!
  receivedAt: AWSDateTime!
  """Non-zero is normal; large means the device's clock is wrong."""
  clockSkewMs: Int
}

type MetricObservation implements Observation @aws_cognito_user_pools {
  observationId: ID!
  deviceId: ID!
  interfaceId: ID
  siteId: ID
  vendor: Vendor!
  encoding: Encoding!
  plane: ObservationPlane!
  severity: Severity!
  observedAt: AWSDateTime!
  receivedAt: AWSDateTime!
  clockSkewMs: Int

  kind: String!
  value: Float!
  unit: String!
}

type EventObservation implements Observation @aws_cognito_user_pools {
  observationId: ID!
  deviceId: ID!
  interfaceId: ID
  siteId: ID
  vendor: Vendor!
  encoding: Encoding!
  plane: ObservationPlane!
  severity: Severity!
  observedAt: AWSDateTime!
  receivedAt: AWSDateTime!
  clockSkewMs: Int

  kind: String!
  """The transition - 'up'/'down', 'established'/'lost'."""
  state: String!
  message: String!
  """Collapses the same real-world event arriving on more than one feed."""
  dedupeKey: String!
}

"""
Flow records are queryable but never subscribable and never in the hot store.
A mid-size edge exports well over 100k flows/sec; they land in S3 as columnar
files and are read analytically.
"""
type FlowObservation implements Observation @aws_cognito_user_pools {
  observationId: ID!
  deviceId: ID!
  interfaceId: ID
  siteId: ID
  vendor: Vendor!
  encoding: Encoding!
  plane: ObservationPlane!
  severity: Severity!
  observedAt: AWSDateTime!
  receivedAt: AWSDateTime!
  clockSkewMs: Int

  srcAddr: String!
  dstAddr: String!
  srcPort: Int!
  dstPort: Int!
  protocol: String!
  octets: Float!
  packets: Float!
  flowStart: AWSDateTime!
  flowEnd: AWSDateTime!
}

type ObservationPage @aws_cognito_user_pools {
  items: [Observation!]!
  """Opaque. Encodes DynamoDB's LastEvaluatedKey - never the raw key."""
  nextToken: String
}

# -----------------------------------------------------------------------------
# Alarms and incidents
# -----------------------------------------------------------------------------

"""What a deterministic rule decided about ONE entity. Not yet a page."""
type Alarm @aws_cognito_user_pools {
  alarmId: ID!
  deviceId: ID!
  interfaceId: ID
  siteId: ID!
  kind: AlarmKind!
  severity: Severity!
  observationIds: [ID!]!

  """
  The distinct vantage points that saw it. TWO OR MORE is the bar for raising
  an incident - and it is planes, not endpoints, because one cloud's event log
  and its status feed can both be relaying the same single witness.
  """
  planes: [ObservationPlane!]!

  uplinkDeviceId: ID
  raisedAt: AWSDateTime!
}

"""
A corroborated cluster of alarms. THIS is what pages a human.

One distribution switch failure produces forty alarms and exactly one incident.
"""
type Incident @aws_cognito_user_pools {
  incidentId: ID!
  title: String!
  severity: Severity!
  status: IncidentStatus!
  siteId: ID!
  deviceIds: [ID!]!
  alarmIds: [ID!]!

  """
  The device correlation believes is the CAUSE, not merely a symptom. The single
  most useful thing this API returns at 4am.
  """
  rootCauseDeviceId: ID

  openedAt: AWSDateTime!
  aiSummary: String
  aiCitations: [Citation!]

  devices: [Device!]! @aws_cognito_user_pools
  observations: [Observation!]! @aws_cognito_user_pools
}

type Citation @aws_cognito_user_pools {
  source: String!
  snippet: String!
}

# -----------------------------------------------------------------------------
# Topology and geo
# -----------------------------------------------------------------------------

"""
The network's answer to "what else is affected".

Not a spatial query. Forty devices in one building share a coordinate exactly,
so proximity says nothing; the device that matters when one fails is the one
ABOVE it, which may be in another building entirely.
"""
type Topology @aws_cognito_user_pools {
  deviceId: ID!
  """Toward the site root, nearest first."""
  upstream: [ID!]!
  """Everything that depends on this device, at any depth. The blast radius."""
  downstream: [ID!]!
}

type MapLayer @aws_cognito_user_pools {
  """A GeoJSON FeatureCollection, serialised. MapLibre styles read it directly."""
  featureCollection: AWSJSON!
  bbox: [Float!]
}

type AgentAnswer @aws_cognito_user_pools {
  answer: String!
  citations: [Citation!]!
  """The tool calls, in order. Provenance is a product feature, not debug output."""
  trace: [AWSJSON!]!
  stoppedBecause: String!
}

# -----------------------------------------------------------------------------
# Query
# -----------------------------------------------------------------------------

type Query @aws_cognito_user_pools {
  """
  Scope comes from the TOKEN, not from `siteId`. An operator who passes another
  site gets an empty list rather than someone else's board.
  """
  devices(siteId: ID, status: DeviceStatus): [Device!]!

  device(deviceId: ID!): Device

  sites: [Site!]!

  devicesAtSite(siteId: ID!): [Device!]!

  """Walk the uplink chain and the subtree. Cause versus symptom."""
  topology(deviceId: ID!): Topology

  alarms(siteId: ID, limit: Int = 50): [Alarm!]!

  observations(severity: Severity, limit: Int = 25): ObservationPage!

  incidents(limit: Int = 25): [Incident!]!
  incident(incidentId: ID!): Incident

  mapLayer: MapLayer!

  """Grounded retrieval over the runbook corpus. Cites what it used."""
  askRunbooks(question: String!): AgentAnswer!
}

# -----------------------------------------------------------------------------
# Mutation
# -----------------------------------------------------------------------------

input OpenIncidentInput {
  title: String!
  severity: Severity!
  siteId: ID!
  deviceIds: [ID!]!
}

input SuppressAlarmInput {
  deviceId: ID!
  minutes: Int!
  reason: String!
}

input PublishAlarmInput {
  alarmId: ID!
  deviceId: ID!
  siteId: ID!
  kind: AlarmKind!
  severity: Severity!
  planes: [ObservationPlane!]!
  raisedAt: AWSDateTime!
}

type Mutation @aws_cognito_user_pools {
  """Pages a human. Field-level RBAC, enforced by AppSync before the resolver."""
  openIncident(input: OpenIncidentInput!): Incident!
    @aws_auth(cognito_groups: ["admin", "operator"])

  acknowledgeIncident(incidentId: ID!): Incident!
    @aws_auth(cognito_groups: ["admin", "operator"])

  """
  Silence a device during planned maintenance.

  Refused for a device others depend on - suppressing it would hide the ROOT
  CAUSE of everything beneath it, so the cascade still pages but names a
  symptom. That check is in the resolver and in the agent's tool, because both
  are entry points to the same action.
  """
  suppressAlarm(input: SuppressAlarmInput!): Boolean!
    @aws_auth(cognito_groups: ["admin", "operator"])

  """
  Called by the ingest pipeline over IAM auth, never by a browser. Its return
  value IS the subscription payload - see the note on onDeviceAlarm.
  """
  publishAlarm(input: PublishAlarmInput!): Alarm! @aws_iam

  askAgent(question: String!): AgentAnswer!
}

# -----------------------------------------------------------------------------
# Subscription
# -----------------------------------------------------------------------------

type Subscription @aws_cognito_user_pools {
  """
  THE DETAIL THAT SURPRISES EVERYONE ONCE: the subscription payload IS the
  mutation's return value. A client filtering on a field the mutation did not
  return silently matches nothing - it does not error, it just goes quiet.
  That is why PublishAlarmInput carries siteId and severity at the top level.
  """
  onDeviceAlarm(siteId: ID, severity: Severity): Alarm
    @aws_subscribe(mutations: ["publishAlarm"])

  onIncidentOpened(siteId: ID): Incident
    @aws_subscribe(mutations: ["openIncident"])

  onIncidentAcknowledged(incidentId: ID): Incident
    @aws_subscribe(mutations: ["acknowledgeIncident"])
}
