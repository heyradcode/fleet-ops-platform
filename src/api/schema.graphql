# =============================================================================
# Meridian GraphQL API (AWS AppSync)
# =============================================================================
# AppSync-specific things to notice, because they are what separates "I have
# used GraphQL" from "I have built on AppSync":
#
#   @aws_cognito_user_pools / @aws_iam / @aws_api_key
#       Authorisation is declared IN THE SCHEMA, per type and per field. You can
#       run several auth modes at once - Cognito for dispatchers, IAM for the
#       ingest Lambda - and AppSync enforces it before a resolver runs.
#
#   @aws_auth(cognito_groups: [...])
#       Field-level RBAC with no resolver code at all.
#
#   @aws_subscription(mutations: [...])
#       Subscriptions are DERIVED from mutations. You do not publish manually:
#       when the named mutation succeeds, AppSync pushes the result over
#       WebSocket to every client whose filter matches. This is the single
#       biggest reason to choose AppSync over a hand-rolled GraphQL server.
#
# THE SUBSCRIPTION FILTER IS A COST DECISION, NOT A FEATURE. At fleet scale a
# dispatcher watching Dallas must not be woken by - or billed for - national
# traffic. See `onDriverException` at the bottom.
# =============================================================================

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# -----------------------------------------------------------------------------
# Enums - mirror src/platform/types.ts exactly.
# -----------------------------------------------------------------------------

enum Severity { ok info warning critical }
enum ProviderDomain { telematics eld_hos video_safety }
enum IncidentStatus { open acknowledged resolved }
enum DriverStatus { driving stopped on_break off_duty }

enum TelemetryKind {
  position
  speeding
  harsh_brake
  idle
  hos_remaining
  route_adherence
  geofence_state
  panic
}

enum ExceptionKind {
  geofence_breach
  harsh_braking
  route_deviation
  prolonged_idle
  hos_risk
  panic
}

# -----------------------------------------------------------------------------
# Types
# -----------------------------------------------------------------------------

type Location {
  lon: Float!
  lat: Float!
  district: ID!
}

type Driver {
  driverId: ID!
  name: String!
  districtId: ID!
  vehicleId: String!
  status: DriverStatus!
  lon: Float!
  lat: Float!

  # Minutes of legal drive time remaining. The board colours on this even when
  # nothing has gone wrong yet - a driver about to run out of hours is a problem
  # you want to see coming, not one you want paged about.
  hosRemainingMinutes: Int!
  updatedAt: AWSDateTime!

  # A nested resolver. Fetched ONLY if the client asks for it - that is the
  # whole point of GraphQL over REST for a board with many widgets.
  # Watch out for N+1: this runs once per Driver in the parent list, so back it
  # with a batch resolver (AppSync BatchInvoke, max 2000 items) rather than a
  # per-item Lambda call.
  telemetry(limit: Int = 20, severity: Severity): [Telemetry!]!
}

type Territory {
  districtId: ID!
  name: String!
  region: String!
  lon: Float!
  lat: Float!
}

type Telemetry {
  telemetryId: ID!
  provider: String!
  domain: ProviderDomain!
  kind: TelemetryKind!
  driverId: ID!
  sourceRef: String!
  value: Float!
  unit: String!
  severity: Severity!
  observedAt: AWSDateTime!
  location: Location
  # AppSync scalar for arbitrary JSON. Convenient, but it is an escape hatch:
  # anything in here is invisible to the client's type system.
  attributes: AWSJSON
}

# What a deterministic rule decided about ONE driver. Not yet a page - see
# Incident. The board shows these so a dispatcher can see what the platform
# noticed but chose not to escalate.
type DriverException {
  exceptionId: ID!
  driverId: ID!
  districtId: ID!
  kind: ExceptionKind!
  severity: Severity!
  # Which vendors witnessed it. Two or more is what makes it corroborated.
  providers: [String!]!
  telemetryIds: [ID!]!
  raisedAt: AWSDateTime!
  driver: Driver
}

type Incident {
  incidentId: ID!
  title: String!
  severity: Severity!
  status: IncidentStatus!
  districtId: ID!
  driverIds: [ID!]!
  exceptionIds: [ID!]!
  openedAt: AWSDateTime!
  aiSummary: String
  aiCitations: [Citation!]!
  drivers: [Driver!]!
  telemetry: [Telemetry!]!
}

type Citation {
  source: String!
  snippet: String!
}

# Cursor-based pagination. NEVER offset-based on DynamoDB: the underlying
# LastEvaluatedKey is a key, not a row number, and offsets cannot express it.
type TelemetryConnection {
  items: [Telemetry!]!
  nextToken: String
}

# GeoJSON crosses the wire as AWSJSON. The alternative - modelling GeoJSON in
# SDL - produces a deep union type that no client wants to write fragments for.
type GeoLayer {
  featureCollection: AWSJSON!
  bbox: [Float!]!
}

type AgentAnswer {
  answer: String!
  citations: [Citation!]!
  # Exposing the trace is a product decision as much as a debugging one: users
  # trust an agent far more when they can see which tools it called.
  trace: [AgentStep!]!
  stoppedBecause: String!
}

type AgentStep {
  step: Int!
  kind: String!
  detail: String!
  ms: Int!
}

# -----------------------------------------------------------------------------
# Query
# -----------------------------------------------------------------------------

type Query @aws_cognito_user_pools {
  # The board's first load. `districtId` is a filter, but scope is enforced
  # from the token regardless - passing another district returns nothing.
  drivers(districtId: ID, status: DriverStatus): [Driver!]!
  driver(driverId: ID!): Driver

  territories: [Territory!]!

  # nextToken is opaque - it is the base64 of DynamoDB's LastEvaluatedKey.
  telemetry(limit: Int = 25, severity: Severity, nextToken: String): TelemetryConnection!

  # Raised but not necessarily escalated. Showing these is what lets a
  # dispatcher see the noise filter working rather than just trusting it.
  exceptions(districtId: ID, limit: Int = 50): [DriverException!]!

  incidents(status: IncidentStatus = open, limit: Int = 25): [Incident!]!
  incident(incidentId: ID!): Incident

  # Spatial query -> Aurora PostGIS ST_DWithin.
  driversNear(lon: Float!, lat: Float!, radiusKm: Float!): [Driver!]!

  # "Who could take this load?" - the same query with the hours-of-service
  # filter applied in SQL, so an ineligible driver can never be offered.
  availableDriversNear(lon: Float!, lat: Float!, radiusKm: Float!): [Driver!]!

  # The map payload: GeoJSON FeatureCollection + bbox.
  mapLayer: GeoLayer!

  # Bedrock RAG over the runbook knowledge base. Read-only, so viewers may use it.
  askRunbooks(question: String!): AgentAnswer!
}

# -----------------------------------------------------------------------------
# Mutation
# -----------------------------------------------------------------------------

type Mutation @aws_cognito_user_pools {
  # Field-level RBAC, enforced by AppSync before any resolver runs.
  openIncident(input: OpenIncidentInput!): Incident!
    @aws_auth(cognito_groups: ["admin", "dispatcher"])

  acknowledgeIncident(incidentId: ID!): Incident!
    @aws_auth(cognito_groups: ["admin", "dispatcher", "safety"])

  # Moving a load is the most consequential thing on this API, so it is the
  # narrowest. The tool the AI agent calls hits this same path and the same
  # check - the agent has no privileged route in.
  reassignDriver(input: ReassignDriverInput!): Incident!
    @aws_auth(cognito_groups: ["admin", "dispatcher"])

  # Invokes the AgentCore loop. Long-running, so in production this returns
  # immediately with a jobId and the answer arrives on a subscription.
  askAgent(question: String!): AgentAnswer!

  # Called by the ingest Lambda, authenticated with IAM rather than a user
  # pool - there is no human in that flow. Multiple auth modes on one API is
  # an AppSync strength worth calling out.
  #
  # NOTE WHAT IS MISSING: there is no publishTelemetry. Telemetry never reaches
  # a subscription, because 11,000 readings/sec pushed to every connected board
  # would be both useless to a human and ruinous to pay for. Positions refresh
  # on a poll; only exceptions are pushed.
  publishException(input: PublishExceptionInput!): DriverException! @aws_iam
}

input OpenIncidentInput {
  title: String!
  severity: Severity!
  districtId: ID!
  driverIds: [ID!]!
}

input ReassignDriverInput {
  fromDriverId: ID!
  toDriverId: ID!
  reason: String!
}

input PublishExceptionInput {
  exceptionId: ID!
  driverId: ID!
  districtId: ID!
  kind: ExceptionKind!
  severity: Severity!
  providers: [String!]!
  raisedAt: AWSDateTime!
}

# -----------------------------------------------------------------------------
# Subscription - real-time, over WebSocket, with server-side filtering
# -----------------------------------------------------------------------------

type Subscription @aws_cognito_user_pools {
  # THE ONE THAT MAKES A 330k-DRIVER BOARD AFFORDABLE.
  #
  # The arguments become a server-side FILTER. AppSync evaluates them BEFORE
  # pushing, so a dispatcher watching Dallas is neither billed for nor woken by
  # Phoenix traffic - and cannot see it in dev tools either, which is a
  # confidentiality property as much as a cost one.
  #
  # Without this you push every event to every client and filter in the browser:
  # slow, expensive, and leaking other districts' data to anyone who looks.
  #
  # Two AppSync limits to design around: 100 subscriptions per connection and a
  # 240KB payload cap. A board watching 40 districts needs ONE subscription with
  # a filter, not 40 subscriptions.
  onDriverException(districtId: ID, severity: Severity, kind: ExceptionKind): DriverException
    @aws_subscription(mutations: ["publishException"])
    @aws_iam
    @aws_cognito_user_pools

  onIncidentOpened(districtId: ID, severity: Severity): Incident
    @aws_subscription(mutations: ["openIncident"])

  onIncidentAcknowledged(incidentId: ID): Incident
    @aws_subscription(mutations: ["acknowledgeIncident"])
}
